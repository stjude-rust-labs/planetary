[package]
name = "planetary-transporter"
description = "The task input and output transporter used by Planetary."
version = "0.1.0"
license.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "planetary-transporter"
path = "src/main.rs"

[features]
default = []
# This feature exists so that every crate in the workspace has the same feature set.
# Currently `rust-analyzer` doesn't support per-crate feature flags for its check,
# so this is needed to analyze the entire workspace with the `postgres` feature enabled.
postgres = []

[dependencies]
anyhow.workspace = true
byte-unit.workspace = true
cfg-if.workspace = true
chrono.workspace = true
clap.workspace = true
clap-verbosity-flag.workspace = true
cloud-copy.workspace = true
futures.workspace = true
glob.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tes.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-indicatif.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
walkdir.workspace = true

[lints]
workspace = true
