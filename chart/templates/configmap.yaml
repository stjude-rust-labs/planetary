apiVersion: v1
kind: ConfigMap
metadata:
  name: templates
data:
  # The orchestrator uses this template when creating resources for tasks.
  # See https://keats.github.io/tera for the template syntax.
  #
  # The following task variables are available:
  #
  #  * `id` (string) - The TES identifier of the task.
  #  * `username` (string) - The username of the user creating the task.
  #  * `cpu` (integer) - The requested number of CPUs for the task.
  #  * `memory` (string) - The requested amount of memory for the task (in GB).
  #  * `disk` (string) - The requested amount of disk space for the task (in GB).
  #  * `inputs` (array of object) - The requested inputs to the task, with fields:
  #    * `path` (string) - The guest path of the input (i.e. from inside the container).
  #    * `local_path` (string, optional) - The shared local storage path of the input, for `file://` inputs.
  #  * `outputs` (array of object) - The requested outputs of the task, with fields:
  #    * `path` (string) - The guest path of the output (i.e. from inside the container).
  #    * `local_path` (string, optional) - The shared local storage path of the output, for `file://` inputs.
  #  * `volumes` (array of string) - The requested volumes for the task.
  #  * `executors` (array of object) - The requested executors of the task, with fields:
  #    * `image` (string) - The image to use for the task.
  #    * `script` (string) - The script to execute for the task.
  #    * `workdir` (string) - The guest working directory of the task (i.e. from inside the container).
  #    * `env` (object with string values) - The environment variable map for the task.
  #
  # All string variables are automatically encoded as JSON strings.
  #
  # All Tera template expression tags (e.g. `{{` and `}}`) must be escaped for the Helm chart.
  task.yaml: |
    # This is the PVC used for the task's `disk` requirement.
    # The task's non-local inputs, non-local outputs, work directory, and
    # `/tmp` are all mounted from this volume.
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: {{ `{{ id }}` }}
    spec:
      {{- if ne .Values.task.storageClass nil }}
      storageClassName: {{ .Values.task.storageClass | quote }}
      {{- end }}
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ `{{ disk }}` }}
    ---
    # The pod that executes a task.
    # There must be exactly one pod for each task.
    apiVersion: v1
    kind: Pod
    metadata:
      name: {{ `{{ id }}` }}
    spec:
      {{ with .Values.orchestrator.preemptible -}}
      # Node selector and toleration to use for preemptible tasks
      {% if preemptible %}
      nodeSelector:
        {{ .nodeSelector.key }}: "{{ .nodeSelector.value }}"
      tolerations:
        - key: "{{ .toleration.key }}"
          operator: Equal
          value: "{{ .toleration.value }}"
      {% endif %}
      {{ end -}}
      # Task pods are required to have a `Never` restart policy
      restartPolicy: Never
      initContainers:
      # The first init container is responsible for downloading inputs and creating empty outputs to mount
      - name: inputs
        image: "{{ .Values.transporter.image.name }}:{{ .Values.transporter.image.tag | default .Chart.AppVersion }}"
        args: ["-v", "--mode", "inputs", "--orchestrator-dir", "/mnt/orchestrator", "--inputs-dir", "/mnt/storage/inputs", "--outputs-dir", "/mnt/storage/outputs", {{ if .Values.local.storage }}"--local-dir", "/mnt/local",{{ end }} {{ `{{ id }}` }}]
        envFrom:
        - secretRef:
            name: azure-storage-credentials
            optional: true
        - secretRef:
            name: aws-s3-credentials
            optional: true
        - secretRef:
            name: google-storage-credentials
            optional: true
        env:
        - name: RUST_LOG
          value: {{ .Values.transporter.log }}
        volumeMounts:
        - name: storage
          mountPath: /mnt/storage
        {{ if .Values.local.storage -}}
        - name: local
          mountPath: /mnt/local
        {{ end -}}
        - name: orchestrator-storage
          mountPath: /mnt/orchestrator
          readOnly: true
          recursiveReadOnly: IfPossible
        resources:
          requests:
            cpu: {{ .Values.transporter.cpu }}
            memory: "{{ .Values.transporter.memory }}"
      # The remaining init containers are the task's executors
      {% for executor in executors %}
      - name: executor-{{ `{{ loop.index0 }}` }}
        image: {{ `{{ executor.image }}` }}
        command: ["/bin/sh"]
        args: ["-c", {{ `{{ executor.script }}` }}]
        workingDir: {{ `{{ executor.workdir }}` }}
        env:
        {% for key, value in executor.env %}
        - name: {{ `{{ key }}` }}
          value: {{ `{{ value }}` }}
        {% endfor %}
        resources:
          requests:
            cpu: {{ `{{ cpu }}` }}
            memory: {{ `{{ memory }}` }}
        volumeMounts:
          - name: storage
            mountPath: /tmp
            subPath: tmp
          {% for volume in volumes %}
          - name: storage
            mountPath: {{ `{{ volume }}` }}
            subPath: volumes/{{ `{{ loop.index0 }}` }}
          {% endfor %}
          {% for input in inputs %}
          {{- if not .Values.local.storage }}
          {% if input.local_path %}{% continue %}{% endif %}
          {{ end -}}
          - name: {% if input.local_path %}local{% else %}storage{% endif %}
            mountPath: {{ `{{ input.path }}` }}
            subPath: {% if input.local_path %}{{ `{{ input.local_path }}` }}{% else %}inputs/{{ `{{ loop.index0 }}` }}{% endif %}
            readOnly: true
            recursiveReadOnly: IfPossible
          {% endfor %}
          {% for output in outputs %}
          {{- if not .Values.local.storage }}
          {% if output.local_path %}{% continue %}{% endif %}
          {{ end -}}
          - name: {% if output.local_path %}local{% else %}storage{% endif %}
            mountPath: {{ `{{ output.path }}` }}
            subPath: {% if output.local_path %}{{ `{{ output.local_path }}` }}{% else %}outputs/{{ `{{ loop.index0 }}` }}{% endif %}
          {% endfor %}
      {% endfor %}
      containers:
      # The primary container of the task pod is responsible for uploading the task's outputs
      - name: outputs
        image: "{{ .Values.transporter.image.name }}:{{ .Values.transporter.image.tag | default .Chart.AppVersion }}"
        args: ["-v", "--mode", "outputs", "--orchestrator-dir", "/mnt/orchestrator", "--outputs-dir", "/mnt/outputs", {{ if .Values.local.storage }}"--local-dir", "/mnt/local",{{ end }} {{ `{{ id }}` }}]
        envFrom:
        - secretRef:
            name: azure-storage-credentials
            optional: true
        - secretRef:
            name: aws-s3-credentials
            optional: true
        - secretRef:
            name: google-storage-credentials
            optional: true
        env:
        - name: RUST_LOG
          value: {{ .Values.transporter.log }}
        volumeMounts:
        - name: storage
          mountPath: /mnt/outputs
          subPath: outputs
          readOnly: true
          recursiveReadOnly: IfPossible
        {{ if .Values.local.storage -}}
        - name: local
          mountPath: /mnt/local
          readOnly: true
          recursiveReadOnly: IfPossible
        {{ end -}}
        # Also mount the task's inputs at the same paths the executors used.
        # A task's work directory may still contain symlinks pointing at
        # input files (e.g. if the task's own cleanup step didn't run
        # because the task failed). Without these mounts, the outputs
        # container can't resolve such symlinks and sweeping the work
        # directory for outputs fails with a spurious "no such file or
        # directory" error, masking the task's real failure.
        {% for input in inputs %}
        {{- if not .Values.local.storage }}
        {% if input.local_path %}{% continue %}{% endif %}
        {{ end -}}
        - name: {% if input.local_path %}local{% else %}storage{% endif %}
          mountPath: {{ `{{ input.path }}` }}
          subPath: {% if input.local_path %}{{ `{{ input.local_path }}` }}{% else %}inputs/{{ `{{ loop.index0 }}` }}{% endif %}
          readOnly: true
          recursiveReadOnly: IfPossible
        {% endfor %}
        - name: orchestrator-storage
          mountPath: /mnt/orchestrator
        resources:
          requests:
            cpu: {{ .Values.transporter.cpu }}
            memory: "{{ .Values.transporter.memory }}"
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: {{ `{{ id }}` }}
      {{ if .Values.local.storage -}}
      - name: local
        {{- with .Values.local.storage -}}
        {{- include "render" (dict "value" . "context" $) | nindent 8 -}}
        {{- end }}
      {{ end -}}
      - name: orchestrator-storage
        {{- with .Values.orchestrator.storage -}}
        {{- include "render" (dict "value" . "context" $) | nindent 8 -}}
        {{- end }}
