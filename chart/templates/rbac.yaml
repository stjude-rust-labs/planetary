{{- if .Values.orchestrator.account.create -}}
# Role for cluster access for the orchestrator
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator-role
  namespace: {{ .Values.tasks.namespace }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "get", "list", "watch", "patch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["create"]
---
# Service account for the orchestrator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.orchestrator.account.name }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
# Role binding for the orchestrator
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator-role-binding
  namespace: {{ .Values.tasks.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orchestrator-role
subjects:
- kind: ServiceAccount
  name: {{ .Values.orchestrator.account.name }}
  namespace: {{ .Release.Namespace }}
{{- end }}
---
{{- if .Values.monitor.account.create -}}
# Role for cluster access for the monitor (planetary namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitor-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]
---
# Role for cluster access for the monitor (tasks namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitor-role
  namespace: {{ .Values.tasks.namespace }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list", "watch", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["delete"]
---
{{- if gt (int .Values.monitor.usageSampleInterval) 0 }}
# Cluster role for the monitor to read kubelet resource metrics through the
# API server's node proxy; granted only when task resource usage sampling is
# enabled.
#
# Note: `nodes/proxy` permits proxying to any kubelet endpoint; it is
# required to read `/metrics/resource` from the nodes hosting task pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-monitor-node-metrics
rules:
- apiGroups: [""]
  resources: ["nodes/proxy"]
  verbs: ["get"]
---
# Cluster role binding for the monitor to read kubelet resource metrics
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-monitor-node-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-monitor-node-metrics
subjects:
- kind: ServiceAccount
  name: {{ .Values.monitor.account.name }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
# Service account for the monitor
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.monitor.account.name }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
# Role binding for the monitor (planetary namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitor-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitor-role
subjects:
- kind: ServiceAccount
  name: {{ .Values.monitor.account.name }}
---
# Role binding for the monitor (tasks namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitor-role-binding
  namespace: {{ .Values.tasks.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitor-role
subjects:
- kind: ServiceAccount
  name: {{ .Values.monitor.account.name }}
  namespace: {{ .Release.Namespace }}
{{- end }}
